name: Bug report
description: Report a reproducible problem with CodexQuotaWidget.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve CodexQuotaWidget. Please remove account details, tokens, and other private data from logs before submitting.

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
    validations:
      required: true

  - type: input
    id: codex
    attributes:
      label: Codex or ChatGPT version
      description: Include which desktop app you use and its version.
      placeholder: Codex 1.x or ChatGPT 1.x
    validations:
      required: true

  - type: input
    id: widget
    attributes:
      label: Widget version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Do not include access tokens, session data, email addresses, or other private information.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed private or account-specific data from the report.
          required: true
