[package]
name = "codex-quota-desktop"
version = "0.2.0"
description = "Cross-platform desktop quota widget for Codex"
authors = ["Codex Quota Tool contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "codex_quota_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
